[package]
name = "calmdesk-setup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Installer for Calmdesk: one exe that carries the app and the built-in widgets"

[dependencies]
widget-engine = { path = "../../../engine/crates/engine" }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
