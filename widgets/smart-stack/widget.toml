#:schema ../../schemas/widget.schema.json
id = "dev.widget-engine.smart-stack"
name = "Smart stack"
category = "Time"
engine = "^0.1"
size = [170, 170]

[card]
radius = 26
background = "frosted"
border = false
shadow = true

[font]
family = "Nunito"
weight = 400

[customize]
allow = ["size", "background", "theme", "font"]

[[option]]
key = "rotate"
label = "Rotate automatically"
default = "on"

