#:schema ../../schemas/widget.schema.json
id = "dev.widget-engine.clock-dual"
name = "Clock"
variant = "Square"
category = "Time"
engine = "^0.1"
size = [170, 170]

[card]
radius = 26
background = "frosted"
border = false
shadow = true

[font]
family = "Nunito"
weight = 600

[customize]
allow = ["size", "background", "theme", "font"]

