#:schema ../../schemas/widget.schema.json
id = "dev.widget-engine.currency"
name = "Exchange rates"
category = "Productivity"
engine = "^0.1"
size = [170, 170]

[card]
radius = 26
background = "frosted"
border = false
shadow = true

[font]
family = "Nunito"
weight = 400

[customize]
allow = ["size", "background", "theme", "font", "colors"]

[[option]]
key = "base"
label = "Base currency"
values = [["USD", "USD"], ["EUR", "EUR"], ["RUB", "RUB"], ["GBP", "GBP"], ["CNY", "CNY"], ["JPY", "JPY"], ["CHF", "CHF"], ["PLN", "PLN"], ["CAD", "CAD"]]
default = "USD"

