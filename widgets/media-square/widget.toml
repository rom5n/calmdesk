#:schema ../../schemas/widget.schema.json
id = "dev.widget-engine.media-square"
name = "Now Playing"
variant = "Square"
category = "Media"
engine = "^0.1"
size = [170, 170]

[card]
radius = 26
background = "glass"
border = false
shadow = true

[font]
family = "Nunito"
weight = 400

[customize]
allow = ["size", "background", "theme", "shape", "font"]

