#:schema ../../schemas/widget.schema.json
id = "dev.widget-engine.clock-world"
name = "World Clock"
category = "Time"
engine = "^0.1"
size = [352, 170]

[card]
radius = 26
background = "solid"
border = false
shadow = true

[font]
family = "Nunito"
weight = 400

[customize]
allow = ["size", "background", "theme", "font"]

