#:schema ../../schemas/widget.schema.json
id = "dev.widget-engine.photo-round"
name = "Photo"
variant = "Round"
category = "Photos"
engine = "^0.1"
size = [170, 170]

[card]
radius = 85
background = "frosted"
border = false
shadow = true

[font]
family = "Nunito"
weight = 400

[customize]
allow = ["size", "background", "theme"]

[[option]]
key = "photo"
label = "Photo"
kind = "image"

[[option]]
key = "folder"
label = "Folder"
kind = "folder"

