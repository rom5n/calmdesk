#:schema ../../schemas/widget.schema.json
id = "dev.widget-engine.weather"
name = "Weather"
variant = "Wide"
category = "Weather"
engine = "^0.1"
size = [352, 170]

[card]
radius = 26
background = "frosted"
border = false
shadow = true

[font]
family = "Nunito"
weight = 400

[customize]
allow = ["size", "background", "theme", "font"]

[[option]]
key = "city"
label = "City"
values = [["auto", "Automatic"], ["Americas/Los Angeles", "Los Angeles"], ["Americas/Chicago", "Chicago"], ["Americas/New York", "New York"], ["Americas/Toronto", "Toronto"], ["Americas/São Paulo", "São Paulo"], ["Europe/London", "London"], ["Europe/Amsterdam", "Amsterdam"], ["Europe/Paris", "Paris"], ["Europe/Madrid", "Madrid"], ["Europe/Rome", "Rome"], ["Europe/Berlin", "Berlin"], ["Europe/Prague", "Prague"], ["Europe/Vienna", "Vienna"], ["Europe/Warsaw", "Warsaw"], ["Europe/Istanbul", "Istanbul"], ["Eastern Europe/Lviv", "Lviv"], ["Eastern Europe/Kyiv", "Kyiv"], ["Eastern Europe/Kharkiv", "Kharkiv"], ["Eastern Europe/Odesa", "Odesa"], ["Eastern Europe/Minsk", "Minsk"], ["Eastern Europe/Saint Petersburg", "Saint Petersburg"], ["Eastern Europe/Moscow", "Moscow"], ["Eastern Europe/Kazan", "Kazan"], ["Asia & Pacific/Yekaterinburg", "Yekaterinburg"], ["Asia & Pacific/Novosibirsk", "Novosibirsk"], ["Asia & Pacific/Almaty", "Almaty"], ["Asia & Pacific/Dubai", "Dubai"], ["Asia & Pacific/New Delhi", "New Delhi"], ["Asia & Pacific/Bangkok", "Bangkok"], ["Asia & Pacific/Singapore", "Singapore"], ["Asia & Pacific/Beijing", "Beijing"], ["Asia & Pacific/Seoul", "Seoul"], ["Asia & Pacific/Tokyo", "Tokyo"], ["Asia & Pacific/Sydney", "Sydney"]]
