#:schema ../../schemas/widget.schema.json
id = "dev.widget-engine.notes-large"
name = "Notes"
variant = "Large"
category = "Productivity"
engine = "^0.1"
size = [352, 352]

[card]
radius = 26
background = "frosted"
border = false
shadow = true

[font]
family = "Nunito"
weight = 400

[customize]
allow = ["size", "background", "theme", "font"]

