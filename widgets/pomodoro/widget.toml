#:schema ../../schemas/widget.schema.json
id = "dev.widget-engine.pomodoro"
name = "Pomodoro"
category = "Productivity"
engine = "^0.1"
size = [170, 170]

[card]
radius = 26
background = "frosted"
border = false
shadow = true

[font]
family = "Nunito"
weight = 600

[customize]
allow = ["size", "background", "theme", "font"]

[[option]]
key = "focus"
label = "Focus length"
values = [["15", "15 min"], ["20", "20 min"], ["25", "25 min"], ["30", "30 min"], ["45", "45 min"], ["50", "50 min"], ["60", "60 min"], ["90", "90 min"]]
default = "25"

[[option]]
key = "break"
label = "Break length"
values = [["3", "3 min"], ["5", "5 min"], ["10", "10 min"], ["15", "15 min"], ["20", "20 min"], ["30", "30 min"]]
default = "5"

