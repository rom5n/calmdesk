#:schema ../../schemas/widget.schema.json
id = "dev.widget-engine.notes-medium"
name = "Notes"
variant = "Medium"
category = "Productivity"
engine = "^0.1"
size = [352, 170]

[card]
radius = 26
background = "frosted"
border = false
shadow = true

[font]
family = "Nunito"
weight = 400

[customize]
allow = ["size", "background", "theme", "font"]

